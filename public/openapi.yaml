openapi: 3.0.3
info:
  title: SIM KDO — REST API
  version: 1.0.0
  description: |
    API pengelolaan Kendaraan Dinas Operasional (KDO), Pegawai Negeri Sipil (penanggung jawab),
    dan Perangkat Daerah.

    **Autentikasi:** panggil `POST /api/login` untuk memperoleh token, lalu klik **Authorize**
    dan tempel token tersebut. Semua endpoint selain login membutuhkan header
    `Authorization: Bearer <token>`.

    **Kode status:** 200 OK · 201 Created · 401 belum login · 404 data tidak ditemukan ·
    409 konflik relasi (data masih dipakai) · 422 validasi gagal · 429 terlalu banyak request.
servers:
  - url: /api
security:
  - bearerAuth: []
tags:
  - name: Auth
  - name: Dashboard
  - name: Kendaraan
  - name: Pegawai
  - name: Perangkat Daerah

paths:
  /login:
    post:
      tags: [Auth]
      summary: Login dan dapatkan token Bearer
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, example: admin@kdo.test }
                password: { type: string, example: password }
                device_name: { type: string, example: postman }
      responses:
        '200':
          description: Login berhasil
          content:
            application/json:
              example:
                message: Login berhasil.
                token_type: Bearer
                access_token: 1|xYz...
                user: { id: 1, name: Administrator BMD, email: admin@kdo.test }
        '422': { $ref: '#/components/responses/Validasi' }
  /me:
    get:
      tags: [Auth]
      summary: Profil pengguna yang sedang login
      responses:
        '200': { description: OK }
        '401': { $ref: '#/components/responses/TidakTerautentikasi' }
  /logout:
    post:
      tags: [Auth]
      summary: Cabut token yang sedang dipakai
      responses:
        '200': { description: Token dicabut }
        '401': { $ref: '#/components/responses/TidakTerautentikasi' }
  /dashboard:
    get:
      tags: [Dashboard]
      summary: Ringkasan statistik kendaraan
      responses:
        '200':
          description: OK
          content:
            application/json:
              example:
                data:
                  total_kendaraan: 20
                  total_pegawai: 16
                  total_perangkat_daerah: 8
                  tanpa_penanggung_jawab: 4
                  per_kondisi: { Baik: 13, Rusak Ringan: 4, Rusak Berat: 3 }
                  per_jenis: { Roda 2: 5, Roda 4: 11, Roda 6: 4 }
                  per_perangkat_daerah:
                    - { id: 7, nama: Badan Pengelolaan Aset Daerah, singkatan: BPAD, total: 3, baik: 2, rusak_ringan: 0, rusak_berat: 1 }

  /kendaraan:
    get:
      tags: [Kendaraan]
      summary: Daftar kendaraan (paginasi + filter)
      parameters:
        - { name: q, in: query, schema: { type: string }, description: Cari nomor polisi / merek / tipe }
        - { name: kondisi, in: query, schema: { $ref: '#/components/schemas/Kondisi' } }
        - { name: jenis, in: query, schema: { $ref: '#/components/schemas/Jenis' } }
        - { name: perangkat_daerah_id, in: query, schema: { type: integer } }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Kendaraan' } }
                  links: { type: object }
                  meta: { $ref: '#/components/schemas/Meta' }
        '401': { $ref: '#/components/responses/TidakTerautentikasi' }
        '422': { $ref: '#/components/responses/Validasi' }
    post:
      tags: [Kendaraan]
      summary: Tambah kendaraan
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/KendaraanInput' }
      responses:
        '201':
          description: Dibuat
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Kendaraan' }
                  message: { type: string, example: Kendaraan berhasil ditambahkan. }
        '401': { $ref: '#/components/responses/TidakTerautentikasi' }
        '422': { $ref: '#/components/responses/Validasi' }
  /kendaraan/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Kendaraan]
      summary: Detail kendaraan beserta riwayat penanggung jawab
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Kendaraan' }
        '404': { $ref: '#/components/responses/TidakDitemukan' }
    put:
      tags: [Kendaraan]
      summary: Ubah kendaraan (penggantian penanggung jawab tercatat otomatis di riwayat)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/KendaraanInput' }
      responses:
        '200': { description: Diperbarui }
        '404': { $ref: '#/components/responses/TidakDitemukan' }
        '422': { $ref: '#/components/responses/Validasi' }
    delete:
      tags: [Kendaraan]
      summary: Hapus kendaraan
      responses:
        '200': { description: Dihapus }
        '404': { $ref: '#/components/responses/TidakDitemukan' }

  /pegawai:
    get:
      tags: [Pegawai]
      summary: Daftar pegawai
      parameters:
        - { name: q, in: query, schema: { type: string }, description: Cari nama / NIP / jabatan }
        - { name: perangkat_daerah_id, in: query, schema: { type: integer } }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Pegawai' } }
                  meta: { $ref: '#/components/schemas/Meta' }
    post:
      tags: [Pegawai]
      summary: Tambah pegawai
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PegawaiInput' }
      responses:
        '201': { description: Dibuat }
        '422': { $ref: '#/components/responses/Validasi' }
  /pegawai/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Pegawai]
      summary: Detail pegawai beserta kendaraan yang dipertanggungjawabkan
      responses:
        '200': { description: OK }
        '404': { $ref: '#/components/responses/TidakDitemukan' }
    put:
      tags: [Pegawai]
      summary: Ubah pegawai
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PegawaiInput' }
      responses:
        '200': { description: Diperbarui }
        '404': { $ref: '#/components/responses/TidakDitemukan' }
        '422': { $ref: '#/components/responses/Validasi' }
    delete:
      tags: [Pegawai]
      summary: Hapus pegawai (ditolak jika masih penanggung jawab kendaraan)
      responses:
        '200': { description: Dihapus }
        '404': { $ref: '#/components/responses/TidakDitemukan' }
        '409': { $ref: '#/components/responses/Konflik' }

  /perangkat-daerah:
    get:
      tags: [Perangkat Daerah]
      summary: Daftar perangkat daerah
      parameters:
        - { name: q, in: query, schema: { type: string } }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/PerangkatDaerah' } }
                  meta: { $ref: '#/components/schemas/Meta' }
    post:
      tags: [Perangkat Daerah]
      summary: Tambah perangkat daerah
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PerangkatDaerahInput' }
      responses:
        '201': { description: Dibuat }
        '422': { $ref: '#/components/responses/Validasi' }
  /perangkat-daerah/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Perangkat Daerah]
      summary: Detail perangkat daerah beserta pegawai dan kendaraannya
      responses:
        '200': { description: OK }
        '404': { $ref: '#/components/responses/TidakDitemukan' }
    put:
      tags: [Perangkat Daerah]
      summary: Ubah perangkat daerah
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PerangkatDaerahInput' }
      responses:
        '200': { description: Diperbarui }
        '422': { $ref: '#/components/responses/Validasi' }
    delete:
      tags: [Perangkat Daerah]
      summary: Hapus perangkat daerah (ditolak jika masih punya pegawai/kendaraan)
      responses:
        '200': { description: Dihapus }
        '409': { $ref: '#/components/responses/Konflik' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    Id: { name: id, in: path, required: true, schema: { type: integer } }
    Page: { name: page, in: query, schema: { type: integer, default: 1 } }
    PerPage: { name: per_page, in: query, schema: { type: integer, default: 15, minimum: 1, maximum: 100 } }
  responses:
    TidakTerautentikasi:
      description: Token tidak ada / tidak valid
      content:
        application/json:
          example: { message: 'Tidak terautentikasi. Sertakan header Authorization: Bearer <token>.' }
    TidakDitemukan:
      description: Data tidak ditemukan
      content:
        application/json:
          example: { message: Data atau endpoint tidak ditemukan. }
    Konflik:
      description: Data masih direlasikan dengan data lain
      content:
        application/json:
          example: { message: Pegawai masih menjadi penanggung jawab kendaraan sehingga tidak dapat dihapus. }
    Validasi:
      description: Validasi gagal
      content:
        application/json:
          example:
            message: 'Format nomor polisi tidak valid (contoh: B 1234 PQA). (dan 1 kesalahan lainnya)'
            errors:
              nomor_polisi: ['Format nomor polisi tidak valid (contoh: B 1234 PQA).']
              pegawai_id: ['Penanggung jawab harus pegawai dari perangkat daerah pemilik kendaraan.']
  schemas:
    Kondisi: { type: string, enum: [Baik, Rusak Ringan, Rusak Berat] }
    Jenis: { type: string, enum: [Roda 2, Roda 4, Roda 6] }
    Meta:
      type: object
      properties:
        current_page: { type: integer }
        last_page: { type: integer }
        per_page: { type: integer }
        total: { type: integer }
    KendaraanInput:
      type: object
      required: [nomor_polisi, jenis, merek, tipe, tahun_produksi, warna, kondisi, perangkat_daerah_id]
      properties:
        nomor_polisi: { type: string, example: B 1999 PQA, description: 'Format "B 1234 PQA", unik' }
        jenis: { $ref: '#/components/schemas/Jenis' }
        merek: { type: string, example: Toyota }
        tipe: { type: string, example: Kijang Innova Zenix }
        tahun_produksi: { type: integer, example: 2024, minimum: 1980 }
        warna: { type: string, example: Hitam }
        kondisi: { $ref: '#/components/schemas/Kondisi' }
        nomor_rangka: { type: string, nullable: true, example: MHFAB8GS6R0009999 }
        nomor_mesin: { type: string, nullable: true, example: M20A7999999 }
        perangkat_daerah_id: { type: integer, example: 1 }
        pegawai_id: { type: integer, nullable: true, example: 1, description: Harus pegawai dari perangkat daerah yang sama }
        keterangan: { type: string, nullable: true }
    Kendaraan:
      allOf:
        - type: object
          properties:
            id: { type: integer }
        - $ref: '#/components/schemas/KendaraanInput'
        - type: object
          properties:
            perangkat_daerah: { $ref: '#/components/schemas/PerangkatDaerah' }
            penanggung_jawab: { $ref: '#/components/schemas/Pegawai' }
            riwayat_penanggung_jawab:
              type: array
              items:
                type: object
                properties:
                  pegawai_id: { type: integer }
                  nama: { type: string }
                  nip: { type: string }
                  tanggal_mulai: { type: string, format: date }
                  tanggal_selesai: { type: string, format: date, nullable: true }
            created_at: { type: string, format: date-time }
            updated_at: { type: string, format: date-time }
    PegawaiInput:
      type: object
      required: [nip, nama, jabatan, golongan, perangkat_daerah_id]
      properties:
        nip: { type: string, example: '199601012022031001', description: 18 digit, unik }
        nama: { type: string, example: Andi Wijaya }
        jabatan: { type: string, example: Pengurus Barang }
        golongan:
          type: string
          enum: [I/a, I/b, I/c, I/d, II/a, II/b, II/c, II/d, III/a, III/b, III/c, III/d, IV/a, IV/b, IV/c, IV/d, IV/e]
          example: III/a
        perangkat_daerah_id: { type: integer, example: 1 }
        no_hp: { type: string, nullable: true, example: '081299990000' }
        email: { type: string, nullable: true, example: andi.wijaya@contoh.go.id }
    Pegawai:
      allOf:
        - type: object
          properties:
            id: { type: integer }
        - $ref: '#/components/schemas/PegawaiInput'
        - type: object
          properties:
            jumlah_kendaraan: { type: integer }
    PerangkatDaerahInput:
      type: object
      required: [kode, nama]
      properties:
        kode: { type: string, example: PD-0301 }
        nama: { type: string, example: Dinas Sosial }
        singkatan: { type: string, nullable: true, example: Dinsos }
        alamat: { type: string, nullable: true }
        telepon: { type: string, nullable: true, example: 021-1234567 }
    PerangkatDaerah:
      allOf:
        - type: object
          properties:
            id: { type: integer }
        - $ref: '#/components/schemas/PerangkatDaerahInput'
        - type: object
          properties:
            jumlah_pegawai: { type: integer }
            jumlah_kendaraan: { type: integer }
